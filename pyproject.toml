[project]
name = "beyond-the-streetlight"
version = "1.1.0"
description = "Trends in Greenbook and SPF forecast errors, 1983-2018: materials for Carroll's discussion of Corrado, Kennickell and Cajner, 'Beyond the Streetlight' (FEDS 2025-019)"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Decory Edwards" },
    { name = "Christopher Carroll" },
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "openpyxl>=3.1",
    "statsmodels>=0.14.2,<0.15",
    "fredpy>=3.2.8",   # only used by scrape_FRED_data.py --refresh
    "requests>=2.31",  # imported by fredpy but not declared by it
    "nbconvert>=7.16", # renders the slides
]

[tool.uv]
# Not an installable package: code/ holds scripts, and a top-level package
# named `code` would shadow the standard-library module of that name.
package = false
