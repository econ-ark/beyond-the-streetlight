# Thin adapter (allowed by the REMARK STANDARD): the pinned environment lives in
# uv.lock, generated from pyproject.toml. This file only provides Python and uv;
# reproduce.sh then installs the locked packages with `uv sync --frozen`.
# On Binder, postBuild also installs them into this environment for the notebook.
name: beyond-the-streetlight
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - uv==0.12.21
